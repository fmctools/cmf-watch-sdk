[package]
name = "wp2-sim"
description = "Host simulator for cmf-watch-sdk apps: the ABI 1.1 Api table on the Mac (docs/app-guide.md, Simulator)"
edition = "2024"
license = "MIT"
version = "0.1.0"

[lib]
name = "wp2_sim"
crate-type = ["cdylib", "rlib"]

[dependencies]
cmf-wp2-app = { path = "../sdk/cmf-wp2-app" }
cmf-wp2-ui = { path = "../sdk/cmf-wp2-ui" }
wp2-core = { path = "../fw/wp2-core" }
minifb = "0.29"
png = "0.18"

[profile.release]
debug = 1

[workspace]
resolver = "3"
members = ["cmf-wp2-app", "cmf-wp2-ui", "examples/hello", "examples/vibration-lab", "examples/motor-hog", "examples/motor-hold", "examples/agent-glow", "examples/api-demo", "examples/herdr-agents", "examples/kit-gallery", "examples/ui-gallery", "examples/lv-demo", "examples/back-owner", "examples/hr-probe", "examples/gps-probe", "examples/wake-probe", "examples/widget-columns", "examples/bitmap-gallery", "examples/bitmap-stream", "examples/bitmap-lv", "examples/keyboards"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

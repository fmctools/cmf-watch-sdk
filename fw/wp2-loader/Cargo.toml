[package]
name = "wp2-loader"
description = "Relocatable NAND loader: view 0xF0 with a framebuffer and the installed-apps menu"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# build for the Watch 3 Pro (jx402_08 1.0.1.77): src/plat.rs. A feature of this crate only, never of wp2-core
wp3 = []

[dependencies]
wp2-core = { path = "../wp2-core" }

[[bin]]
name = "wp2-loader"
bench = false
